<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识星图 · 三维星系</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:dark;--bg:#101113;--surface:#18191c;--raised:#24262a;--text:#eeeff0;--secondary:#b3b5bc;--muted:#90939d;--line:#ffffff15;--edge:#737e8e60;--structure-edge:#93a0b69e;--cross-edge:#8494ac8c;--focus-edge:#d2e4ff;--dim:#34383f}
:root[data-theme=light]{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--raised:#ebeef2;--text:#202329;--secondary:#565e69;--muted:#69727d;--line:#1b243416;--edge:#63728a70;--structure-edge:#4d6079b3;--cross-edge:#54708aa6;--focus-edge:#245ca0;--dim:#d7dbe2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;color:inherit;background:none;border:1px solid transparent;border-radius:8px;min-height:36px;padding:8px 12px;font-size:13px}button:hover{background:var(--raised)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #8caedb;outline-offset:2px}button[aria-pressed=true],button[aria-current=page],button[aria-current=true]{background:var(--raised);border-color:var(--line)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icon{display:flex;align-items:center;justify-content:center;width:36px;padding:8px}[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:248px minmax(0,1fr);overflow:hidden}.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:24px 16px 16px;z-index:5}.brand{font-weight:500;font-size:18px;margin:0 8px 24px}.search{position:relative;margin-bottom:24px}.search-field{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}input{width:100%;border:0;color:var(--text);background:transparent;font-size:13px;min-width:0}input::placeholder{color:var(--muted)}kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 4px}.search-results{position:absolute;top:48px;left:0;right:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;max-height:min(380px,55dvh);overflow:auto;box-shadow:0 12px 32px #0002;z-index:8}.search-results button{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px}.search-results small,.external-list small{color:var(--muted);font-size:11px}.search-results p{font-size:13px;color:var(--muted);padding:0 8px}.nav-scroll{overflow:auto;flex:1;min-height:0}.overview{width:100%;display:flex;align-items:center;gap:8px;text-align:left;margin-bottom:24px}.section-label{font-size:12px;font-weight:400;color:var(--muted);margin:0 12px 8px}.legend{display:flex;flex-direction:column;gap:4px}.domain-row{width:100%;display:flex;gap:12px;align-items:center;text-align:left;height:36px}.domain-row i{width:6px;height:6px;border-radius:50%;flex-shrink:0}.domain-row span{flex:1}.domain-row small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.domain-row[aria-expanded=true]{background:var(--raised)}.topic-list{display:flex;flex-direction:column;gap:4px;margin:4px 0 12px 24px;padding-left:8px;border-left:1px solid var(--line)}.topic-list button{text-align:left;color:var(--secondary);min-height:32px;padding:4px 8px;font-size:12px}.external-section{margin-top:24px}.external-list{display:flex;flex-direction:column;gap:4px}.external-list button{display:flex;flex-direction:column;gap:4px;text-align:left}.sidebar-footer{border-top:1px solid var(--line);margin-top:16px;padding:12px 8px 0;color:var(--muted);font-size:11px;line-height:1.8}.sidebar-footer button{font-size:11px;padding:4px 0;min-height:28px;text-align:left;color:var(--secondary)}
.workspace{position:relative;min-height:0;overflow:hidden}.map{position:absolute;inset:0;cursor:grab;z-index:0}.map canvas{display:block}.canvas-header{position:absolute;top:0;left:0;right:0;padding:24px 32px;display:flex;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}.canvas-header button{pointer-events:auto;background:var(--bg);border-color:var(--line)}.heading{flex:1;min-width:0}.heading h1{font-size:26px;line-height:34px;font-weight:600;margin:0 0 8px}.heading p{font-size:12px;color:var(--muted);margin:0;line-height:20px}.canvas-header .back{position:absolute;left:24px;top:24px;width:32px;min-height:32px;padding:6px;border:1px solid var(--line);color:var(--secondary);background:var(--surface)}.heading:has(.back:not([hidden])){padding-left:40px}.controls{max-width:calc(100% - 64px);flex-wrap:wrap;position:absolute;bottom:24px;left:32px;display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface);z-index:2}.controls .separator{width:1px;background:var(--line);margin:8px 4px}.canvas-meta{position:absolute;bottom:84px;left:32px;color:var(--muted);font-size:11px;line-height:20px;pointer-events:none}.hover-caption{display:block;color:var(--secondary);min-height:20px;margin-bottom:4px}.hint{position:absolute;bottom:32px;right:32px;color:var(--muted);font-size:11px;pointer-events:none}.inspector{position:absolute;right:24px;bottom:76px;width:300px;max-height:calc(100% - 220px);overflow:auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);z-index:3}.inspector .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.inspector .head span{font-size:11px;color:var(--muted)}.inspector .head button{min-height:28px;width:28px;padding:4px}.inspector h2{font-weight:500;font-size:18px;margin:0 0 12px;line-height:1.5}.inspector p{font-size:13px;color:var(--secondary);line-height:1.7;margin:0 0 12px}.inspector .path{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.inspector footer{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}.inspector footer span{font-size:11px;color:var(--muted)}.inspector footer button{font-size:12px;background:var(--raised)}.related{display:flex;flex-direction:column;gap:4px;margin-top:12px}.related button{text-align:left;color:var(--secondary);font-size:12px;min-height:32px;padding:4px 8px}.notice{position:absolute;top:144px;left:32px;right:32px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:13px;z-index:4}.node-label{display:block;min-height:20px;border:0;cursor:pointer;color:var(--secondary);font-size:12px;line-height:20px;padding:0 4px;background:var(--bg);border-radius:4px;white-space:nowrap;pointer-events:auto}.node-label:hover{color:var(--text);background:var(--raised)}.node-label.domain{font-size:14px;color:var(--text)}.node-label.external{font-size:11px;color:var(--muted)}.node-label.selected{color:var(--text);border:1px solid var(--line)}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#navigation-toggle{display:none}
@media(max-width:1000px){.hint{bottom:132px;left:32px;right:auto}.inspector{bottom:164px;max-height:calc(100% - 340px)}}
@media(max-width:680px){.app{display:block}.workspace{height:100dvh}.sidebar{position:absolute;inset:64px auto 0 0;width:264px;display:none;box-shadow:8px 0 24px #0002}.sidebar-open .sidebar{display:flex}#navigation-toggle{display:flex}.canvas-header{padding:16px;gap:12px}.heading h1{font-size:20px;line-height:28px;margin-bottom:4px}.canvas-header .back{left:64px;top:16px}.heading p{max-width:220px;font-size:11px;line-height:18px}.controls{left:16px;bottom:16px;max-width:calc(100% - 32px);gap:2px}.controls button{font-size:12px;padding:6px 8px}.controls .separator{display:none}.controls .icon{width:30px}.canvas-meta{display:none}.canvas-meta{left:16px;bottom:72px;font-size:10px;max-width:calc(100% - 32px)}.hint{left:16px;bottom:112px;max-width:calc(100% - 32px);font-size:10px}.inspector{right:16px;bottom:148px;width:min(300px,calc(100% - 32px));max-height:calc(100% - 340px);padding:16px}.inspector h2{font-size:16px}.notice{top:144px;left:16px;right:16px}.node-label.domain{font-size:12px}}

.compact-count{display:none}.inspector .head{position:sticky;top:-20px;background:var(--surface);padding:8px 0;z-index:1}.inspector h2,.heading h1{overflow-wrap:anywhere}.inspector #open-note{padding:8px 0}.controls{align-items:center}.controls button{white-space:nowrap}
@media(max-width:680px){.compact-count{display:block!important;color:var(--muted);font-size:11px;margin-top:4px}.heading #view-subtitle:empty{display:none}.hint{display:none}.controls{bottom:12px;right:12px;left:12px;max-width:none;gap:4px}.controls button{min-height:36px;padding:6px 8px}.controls .icon{width:32px}.inspector{left:12px;right:12px;bottom:112px;width:auto;max-height:calc(100% - 180px);padding:16px;border-radius:16px}.inspector .head{top:-16px;margin-bottom:8px}.inspector h2{font-size:18px;margin-bottom:8px}.inspector p{margin-bottom:8px}.sidebar{inset:80px auto 0 0}.heading h1{font-size:22px}.canvas-header{gap:8px}}
@media(pointer:coarse){.hint{display:none}.controls button{min-height:44px}}
</style></head>
<body><div class="app">
<aside id="sidebar" class="sidebar" aria-label="知识导航">
<div class="brand">知识星图</div>
<div class="search"><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="screen-reader">搜索主题或知识</span><input id="search" type="search" autocomplete="off" placeholder="搜索主题或知识" aria-controls="results" aria-expanded="false"><kbd>/</kbd></label><div id="results" class="search-results" aria-label="搜索结果" hidden></div></div>
<div class="nav-scroll"><button id="overview" class="overview" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3" ry="8"/><path d="M4 12h16"/></svg>全库星空</button>
<h2 class="section-label">知识主题</h2><nav id="legend" class="legend" aria-label="知识主题与分组"></nav>
<section id="external-section" class="external-section" hidden><h2 class="section-label">直接对外关联</h2><nav id="external-list" class="external-list" aria-label="外部关联主题"></nav></section></div>
<footer class="sidebar-footer"><span id="data-source">读取已保存知识</span><br><button id="export">导出图数据 ↓</button></footer></aside>
<main class="workspace"><div id="map" class="map" aria-label="三维知识星图；按住鼠标中键旋转，滚轮缩放；也可使用左侧搜索与目录"></div>
<header class="canvas-header"><button id="navigation-toggle" class="icon" aria-label="切换知识导航" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="heading"><button id="back" class="back icon" aria-label="返回上一级" title="返回上一级" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><h1 id="view-title">全库星空</h1><p id="view-subtitle"></p><p id="compact-count" class="compact-count"></p></div><button id="theme" class="icon" aria-label="切换明暗主题"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></header>
<div class="canvas-meta"><span id="hover-caption" class="hover-caption" aria-live="polite"></span><span id="visible-count"></span></div>
<div class="controls" aria-label="画布控制"><button id="zoom-in" class="icon" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoom-out" class="icon" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="separator"></span><button id="open-topic" hidden>阅读主题</button><button id="outside-view" aria-pressed="true" title="从球体外部观察">外部视角</button><button id="center-view" aria-pressed="false" title="从球体中心观察">中心视角</button><span class="separator"></span><button id="normal-view" aria-pressed="true" title="随距离简化，悬停查看关联">常态</button><button id="full-view" aria-pressed="false" title="显示当前范围全部节点与关联">全视图</button></div>
<span class="hint" id="interaction-hint"></span>
<aside id="inspector" class="inspector" hidden aria-label="知识短预览"><div class="head"><span id="detail-kind"></span><button id="close" class="icon" aria-label="关闭详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2 id="detail-title"></h2><p id="detail-summary"></p><p id="detail-path" class="path"></p><a id="open-note" hidden style="display:block;color:var(--text);font-size:13px;margin-bottom:12px">在 Obsidian 中打开 ↗</a><footer><span id="detail-degree"></span><button id="detail-focus">定位此处</button></footer><nav id="related" class="related" aria-label="条目直接关联"></nav></aside>
<p id="notice" class="notice" role="status" hidden></p><span id="status" class="screen-reader" role="status"></span>
</main></div><script>/* APP */</script></body></html>
